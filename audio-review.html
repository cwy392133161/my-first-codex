<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f6ee">
  <title>英语发音试听 · 学习小乐园</title>
  <link rel="stylesheet" href="audio-review.css?v=azure-jenny-unit3-v1-20261013">
</head>
<body>
  <header><a href="index.html">← 返回学习小乐园</a></header>
  <main>
    <section class="intro" aria-labelledby="review-title">
      <p class="eyebrow">家长试听</p>
      <h1 id="review-title">英语发音试听</h1>
      <p>先听 Hello 和 Hi，再核对数字、颜色、Unit 3 农场问答和其他学习内容。这里播放与练习相同的英语录音。</p>
      <p id="audio-version" class="version">正在读取音频清单……</p>
      <p class="note">这里使用 Azure Jenny 美式英语示范音频，默认风格、正常语速。文件与播放检查不能代替逐条人工听辨；请先核对 Hello 和 Hi。本页不会修改学习记录。</p>
    </section>

    <section id="playback" class="playback" aria-label="播放控制">
      <div>
        <p id="current-clip" lang="en">选择下面的音频</p>
        <p id="playback-status" role="status" aria-live="polite">请先确认设备的媒体音量已打开。</p>
      </div>
      <button type="button" id="stop-audio" disabled>停止播放</button>
    </section>

    <section class="panel" aria-labelledby="priority-title">
      <h2 id="priority-title">先听这些</h2>
      <div id="priority-clips"></div>
    </section>

    <section class="panel" aria-labelledby="all-title">
      <h2 id="all-title">全部音频</h2>
      <label for="audio-search">搜索英文单词或句子</label>
      <input type="search" id="audio-search" placeholder="例如 hello、read、farm" autocomplete="off" spellcheck="false">
      <p id="result-count" class="count" role="status" aria-live="polite"></p>
      <p id="no-results" hidden>没有找到。试试输入更短的英文单词。</p>
      <div id="all-clips" class="clip-list"></div>
    </section>
  </main>
  <footer>使用项目内的录音文件，可与老师的标准发音对照试听。</footer>
  <script src="speech-text.js?v=azure-jenny-unit3-v1-20261013"></script>
  <script src="data/audio-manifest.js?v=azure-jenny-unit3-v1-20261013"></script>
  <script src="audio-player.js?v=azure-jenny-unit3-v1-20261013"></script>
  <script src="audio-review.js?v=azure-jenny-unit3-v1-20261013"></script>
</body>
</html>
